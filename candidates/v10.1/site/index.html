/* Brand core (brand.css §06) */
--ml-deep-navy:#0A1433;
--ml-orbit-blue:#2563EB;
--ml-pure-white:#F8FAFF;
--ml-steel-blue:#93B4FF;
/* Supporting blues */
--ml-orbit-bright:#3B82F6;
--ml-orbit-light:#6EA8FF;
/* Space / surfaces, darkest → lightest */
--ml-void:#020918;
--ml-space:#050B1F;
--ml-panel:#03091A;
--ml-card:#060E27;
--ml-blueprint:#060F2B;
--ml-navy-raised:#0F1C45;
--ml-node-fill:#0E1E4E;
--ml-node-lit:#12275F;
/* Ink ladder on dark */
--ml-ink-1:#F8FAFF;
--ml-ink-2:#E4EAFB;
--ml-ink-3:#C9D5F5;
--ml-ink-4:#9AA8CC;
--ml-ink-5:#7F8DB5;
--ml-ink-6:#56648C;
/* Hairlines (steel blue at alpha) */
--ml-line-faint:rgba(147,180,255,.12);
--ml-line:rgba(147,180,255,.16);
--ml-line-strong:rgba(147,180,255,.22);
--ml-line-chip:rgba(147,180,255,.32);
--ml-line-hover:rgba(147,180,255,.4);

/* Semantic aliases */
--bg-page:var(--ml-void);
--bg-hero:var(--ml-deep-navy);
--surface-panel:rgba(3,9,26,.9);
--surface-card:var(--ml-card);
--surface-figure:var(--ml-blueprint);
--text-heading:var(--ml-ink-1);
--text-body:var(--ml-ink-3);
--text-muted:var(--ml-ink-4);
--text-meta:var(--ml-ink-5);
--text-accent:var(--ml-orbit-light);
--text-label:var(--ml-steel-blue);
--text-index:var(--ml-orbit-bright);
--link:var(--ml-steel-blue);
--link-hover:var(--ml-pure-white);
--accent:var(--ml-orbit-bright);
--accent-strong:var(--ml-orbit-blue);
--border-default:var(--ml-line);
--border-hover:var(--ml-line-hover);
--focus-ring:var(--ml-steel-blue);
}

:root{
--ml-font-display:'Montserrat','Segoe UI',system-ui,sans-serif;
--ml-font-body:'Inter','Segoe UI',system-ui,sans-serif;
--ml-font-mono:'IBM Plex Mono',ui-monospace,monospace;

/* Tracking */
--ml-tracking-hero:.34em;     /* hero wordmark */
--ml-tracking-tagline:.5em;   /* "Ideas in orbit" */
--ml-tracking-wide:.28em;     /* nav wordmark */
--ml-tracking-nav:.24em;      /* nav links */
--ml-tracking-label:.2em;     /* uppercase Montserrat labels */
--ml-tracking-mono:.14em;     /* mono eyebrows / meta */
--ml-tracking-heading:.005em; /* sentence-case display heads */

/* Scale (fixed px from the site; fluid heads use clamp) */
--ml-size-hero:clamp(28px,5.2vw,84px);
--ml-size-closing:clamp(44px,6vw,92px);
--ml-size-h2:clamp(34px,3.6vw,52px);
--ml-size-h3:clamp(24px,2.4vw,32px);
--ml-size-lede:17px;
--ml-size-body:15px;
--ml-size-small:14px;
--ml-size-caption:13px;
--ml-size-label:15px;   /* uppercase index-list names */
--ml-size-nav:11px;
--ml-size-mono:11px;
--ml-size-mono-sm:10.5px;

--ml-leading-tight:1.06;
--ml-leading-snug:1.35;
--ml-leading-body:1.6;

/* Semantic */
--font-heading:var(--ml-font-display);
--font-body:var(--ml-font-body);
--font-meta:var(--ml-font-mono);
}

:root{
/* Spacing — values used across the site (px, not a strict grid) */
--ml-space-1:4px;
--ml-space-2:8px;
--ml-space-3:10px;
--ml-space-4:12px;
--ml-space-5:14px;
--ml-space-6:18px;
--ml-space-7:20px;
--ml-space-8:24px;
--ml-space-9:28px;
--ml-space-10:40px;
--ml-space-11:56px;
--ml-space-12:64px;
--ml-gutter:clamp(20px,4vw,56px); /* @kind spacing */
--ml-panel-pad:clamp(24px,3.4vw,48px) clamp(18px,3.4vw,48px);
--ml-content-max:1320px;
--ml-hit:44px;

/* Radii */
--ml-radius-card:4px;
--ml-radius-panel:6px;
--ml-radius-brand:14px;
--ml-radius-pill:999px;

/* Shadows & glow */
--ml-shadow-panel:0 30px 80px rgba(0,0,0,.45);
--ml-glow:0 0 24px rgba(37,99,235,.55),0 0 64px rgba(37,99,235,.25);
--ml-glow-node:0 0 10px rgba(37,99,235,.9),0 0 28px rgba(37,99,235,.5);
--ml-glow-node-hot:0 0 14px rgba(37,99,235,1),0 0 40px rgba(37,99,235,.6);
--ml-glow-soft:0 0 16px rgba(37,99,235,.35);
--ml-glow-selected:0 0 0 1px rgba(59,130,246,.3),0 0 44px rgba(37,99,235,.45);
--ml-glow-filter:drop-shadow(0 0 10px rgba(37,99,235,.7)) drop-shadow(0 0 28px rgba(37,99,235,.35)); /* @kind other */

/* Motion */
--ml-ease:cubic-bezier(.2,.7,.2,1); /* @kind other */
--ml-dur-fast:.25s; /* @kind other */
--ml-dur-ui:.4s; /* @kind other */
--ml-dur-move:.7s; /* @kind other */
--ml-dur-trajectory:1.6s; /* @kind other */
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg-page);color:var(--ml-ink-1);font-family:var(--ml-font-body);-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-hover)}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:4px;border-radius:2px}

</style>
