    <stop offset=".7" stop-color="#0A1433"></stop>
    <stop offset="1" stop-color="#050B1F"></stop>
  </radialGradient>
  <filter id="icautomation-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"></feGaussianBlur>
    <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="b"></feMergeNode></feMerge>
  </filter>
  <filter id="icautomation-soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"></feGaussianBlur>
  </filter>
</defs>
