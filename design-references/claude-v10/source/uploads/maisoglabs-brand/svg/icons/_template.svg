<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Template icon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Template icon</title>
<defs>
  <linearGradient id="ic-stroke" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"></stop>
    <stop offset=".55" stop-color="#E4ECFF"></stop>
    <stop offset="1" stop-color="#93B4FF"></stop>
  </linearGradient>
  <linearGradient id="ic-orbit" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#93B4FF" stop-opacity=".25"></stop>
    <stop offset=".6" stop-color="#93B4FF" stop-opacity=".9"></stop>
    <stop offset="1" stop-color="#FFFFFF"></stop>
  </linearGradient>
  <radialGradient id="ic-node" cx=".35" cy=".35" r=".7">
    <stop offset="0" stop-color="#FFFFFF"></stop>
    <stop offset=".45" stop-color="#BFD2FF"></stop>
    <stop offset="1" stop-color="#2563EB"></stop>
  </radialGradient>
  <radialGradient id="ic-halo" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#2563EB" stop-opacity=".55"></stop>
    <stop offset=".6" stop-color="#2563EB" stop-opacity=".12"></stop>
    <stop offset="1" stop-color="#2563EB" stop-opacity="0"></stop>
  </radialGradient>
  <radialGradient id="ic-disc" cx=".5" cy=".4" r=".65">
    <stop offset="0" stop-color="#13265E"></stop>
    <stop offset=".7" stop-color="#0A1433"></stop>
    <stop offset="1" stop-color="#050B1F"></stop>
  </radialGradient>
  <filter id="ic-glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"></feGaussianBlur>
    <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="b"></feMergeNode></feMerge>
  </filter>
  <filter id="ic-soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"></feGaussianBlur>
  </filter>
</defs>
<circle cx="120" cy="120" r="80" fill="url(#ic-disc)"></circle>
<path d="M21.09 160.14 A104 26 -18 0 1 218.91 95.86" fill="none" stroke="url(#ic-orbit)" stroke-width="2" opacity=".35"></path>
<circle cx="120" cy="120" r="80" fill="none" stroke="#93B4FF" stroke-width="2" opacity=".75"></circle>

<rect x="70" y="70" width="100" height="100" fill="none" stroke="#93B4FF" stroke-dasharray="4 4" opacity=".4"></rect>
<path d="M218.91 95.86 A104 26 -18 0 1 21.09 160.14" fill="none" stroke="url(#ic-orbit)" stroke-width="3" stroke-linecap="round"></path>
<circle cx="201.64" cy="87.8" r="12" fill="#2563EB" opacity=".7" filter="url(#ic-soft)"></circle>
<circle cx="201.64" cy="87.8" r="7" fill="url(#ic-node)"></circle>
</svg>