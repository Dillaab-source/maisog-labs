name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [governance/maisoglabs-v0.1]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
